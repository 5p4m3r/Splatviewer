<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' data:; worker-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' data:;">
    <meta name="referrer" content="no-referrer">
    <title>Gaussian Splat AR Viewer</title>
    <script type="importmap">
    {
        "imports": {
            "three": "./src/three/three.module.js",
            "three/addons/": "./src/three/addons/",
            "@sparkjsdev/spark": "./src/spark/spark.module.js",
            "stats.js": "./src/stats/Stats.js"
        }
    }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            touch-action: none;
        }

        /* Minimal styles - splat-viewer.js injects the full component styles */
        /* These are just basic fallbacks before the component loads */
        splat-viewer {
            display: block;
            width: 100%;
            height: 100vh;
            position: relative;
        }
    </style>
</head>
<body>
    <splat-viewer
         splat-src="SatsumaVase.sog"
         camera-position="0,1,2"
         camera-look-at="0,0.8,0"
         transform-position="0,0,0"
         transform-rotate="180,0,0"
         transform-ar-scale="1,1,1"
         transform-ar-position="0,0.0,0"
         transform-ar-rotate="180,0,0"
         min-scale="0.05"
         max-scale="5.0"
         enable-ar="true"
         fps="true">
    </splat-viewer>

    <script>
    // CSP workaround for hosts that block fetch(data:...) in embedded contexts.
    // Spark stays unmodified; we only intercept wasm data URL fetches.
    (() => {
        const nativeFetch = window.fetch.bind(window);

        function toUrlString(input) {
            if (typeof input === "string") return input;
            if (input && typeof input.url === "string") return input.url;
            if (input && typeof input.href === "string") return input.href;
            return "";
        }

        window.fetch = async (input, init) => {
            const url = toUrlString(input);

            if (url.startsWith("data:application/wasm;base64,")) {
                const b64 = url.slice("data:application/wasm;base64,".length);
                const bin = atob(b64);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

                return new Response(bytes, {
                    status: 200,
                    headers: { "Content-Type": "application/wasm" }
                });
            }

            return nativeFetch(input, init);
        };
    })();
    </script>
    <script type="module" src="splat-viewer.js"></script>
</body>
</html>
